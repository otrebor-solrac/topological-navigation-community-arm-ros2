<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>White-Box Dashboard | Topología T3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <style>
        body { margin: 0; background: #010103; color: #00ff9d; font-family: 'Courier New', monospace; overflow: hidden; display: flex; }
        
        #canvas-container { flex-grow: 1; position: relative; height: 100vh; }
        #sidebar { width: 320px; background: rgba(5, 5, 10, 0.98); border-left: 1px solid #333; padding: 20px; overflow-y: auto; }

        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        .stat { margin-bottom: 8px; background: rgba(0, 255, 157, 0.05); padding: 8px 12px; border-left: 3px solid #00ff9d; font-size: 0.9em; }
        
        #btn-container { position: absolute; top: 20px; right: 20px; z-index: 100; }
        button { 
            background: #111; color: #ffff00; border: 2px solid #ffff00; 
            padding: 10px 20px; cursor: pointer; font-family: monospace; font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.1);
        }
        button:hover { background: #ffff00; color: #000; }

        .axis-label { position: absolute; font-weight: bold; font-size: 1.1em; pointer-events: none; text-shadow: 2px 2px 4px #000; }
        #label-th1 { color: #ff5555; }
        #label-th2 { color: #55ff55; }
        #label-th3 { color: #5555ff; }

        h3 { color: #fff; border-bottom: 1px solid #00ff9d; padding-bottom: 5px; margin-top: 0; font-size: 1.1em; letter-spacing: 1px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; color: #ccc; margin-top: 10px; }
        th { text-align: left; color: #00ff9d; padding: 10px 5px; border-bottom: 1px solid #333; }
        td { padding: 8px 5px; border-bottom: 1px solid #1a1a1a; }
        .current-row td { color: #ffff00; font-weight: bold; background: rgba(255, 255, 0, 0.05); }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-size: 0.85em; color: #888; margin-bottom: 5px; }
        .control-group select { 
            width: 100%; background: #111; color: #00ff9d; border: 1px solid #333; 
            padding: 8px; font-family: monospace; font-size: 0.9em; outline: none;
        }
        .control-group select:focus { border-color: #00ff9d; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="ui">
            <h2 style="margin: 0; color: #fff; letter-spacing: 2px;">T³ MANIFOLD VISUALIZER</h2>
            <div id="connection" class="stat" style="color: #ff4d4d; border-color: #ff4d4d;">ROS: DISCONNECTED</div>
        </div>

        <div id="btn-container">
            <button id="btn-toggle-cspace" onclick="toggleCSpaceMode()" style="color: #00d4ff; border-color: #00d4ff; box-shadow: 0 0 15px rgba(0, 212, 255, 0.1); margin-right: 10px;">SHOW: C-FREE (WORKSPACE)</button>
            <button onclick="clearTrajectory()">CLEAR PATH</button>
        </div>

        <div id="label-th1" class="axis-label">base_yaw_joint</div>
        <div id="label-th2" class="axis-label">shoulder_pitch_joint</div>
        <div id="label-th3" class="axis-label">elbow_pitch_joint</div>
    </div>

    <div id="sidebar">
        <h3>PLANNER CONTROL</h3>
        <div class="control-group">
            <label for="select-planner">Algorithm:</label>
            <select id="select-planner" onchange="updatePlannerParams()">
                <option value="astar">A* (Toroidal Grid)</option>
                <option value="rrt">RRT (Continuous T^n)</option>
            </select>
        </div>

        <div class="control-group" id="heuristic-group">
            <label for="select-heuristic">Heuristic:</label>
            <select id="select-heuristic" onchange="updatePlannerParams()">
                <option value="L2">L2 (Euclidean)</option>
                <option value="L1">L1 (Manhattan)</option>
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <div class="control-group" style="margin-bottom: 10px;">
                <label>Manual Target (θ₁, θ₂, θ₃) [rad]:</label>
                <div style="display: flex; gap: 5px;">
                    <input type="number" id="goal-th1" value="0.0" step="0.1" style="width: 30%; background: #111; color: #fff; border: 1px solid #333; padding: 5px; font-family: monospace;">
                    <input type="number" id="goal-th2" value="0.0" step="0.1" style="width: 30%; background: #111; color: #fff; border: 1px solid #333; padding: 5px; font-family: monospace;">
                    <input type="number" id="goal-th3" value="0.0" step="0.1" style="width: 30%; background: #111; color: #fff; border: 1px solid #333; padding: 5px; font-family: monospace;">
                </div>
            </div>
            <button onclick="planToCurrentGoal()" style="width: 100%; color: #00ff9d; border-color: #00ff9d; padding: 8px; font-size: 0.85em;">PLAN & EXECUTE GOAL</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #222; margin: 15px 0;">

        <h3>WAYPOINT SEQUENCER</h3>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <button onclick="addCurrentAsWaypoint()" style="flex-grow: 1; padding: 6px; font-size: 0.75em; border-color: #ffff00; color: #ffff00;">+ ADD CURRENT</button>
            <button onclick="clearWaypointSequence()" style="flex-grow: 1; padding: 6px; font-size: 0.75em; border-color: #ff5555; color: #ff5555;">CLEAR ALL</button>
        </div>
        <div id="waypoint-list" style="max-height: 120px; overflow-y: auto; border: 1px solid #222; background: rgba(0,0,0,0.5); padding: 5px; font-size: 0.8em; margin-bottom: 10px; font-family: monospace;">
            <div style="color: #666; text-align: center; padding: 10px;">No waypoints added</div>
        </div>
        <button id="btn-exec-seq" onclick="executeWaypointSequence()" style="width: 100%; color: #ffff00; border-color: #ffff00; padding: 8px; font-size: 0.85em; display: none;">EXECUTE SEQUENCE</button>

        <hr style="border: 0; border-top: 1px solid #222; margin: 15px 0;">

        <h3>TRACEABILITY</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>θ₁</th>
                    <th>θ₂</th>
                    <th>θ₃</th>
                </tr>
            </thead>
            <tbody id="trace-table"></tbody>
        </table>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
